name: build-extension

# Build per-platform VSIXes for the msbuild-diagnostic-mcp VS Code extension on every
# push and PR. This workflow does NOT publish; publishing happens in
# `publish-extension.yml` which is gated behind a required-reviewer
# environment and only fires on `v*` tags.

on:
  push:
    branches: [main]
    paths:
      - "crates/msbuild-diagnostic-mcp/**"
      - "crates/msbuild-diagnostic/**"
      - ".github/workflows/build-extension.yml"
      - "Cargo.toml"
      - "Cargo.lock"
  pull_request:
    paths:
      - "crates/msbuild-diagnostic-mcp/**"
      - "crates/msbuild-diagnostic/**"
      - ".github/workflows/build-extension.yml"
      - "Cargo.toml"
      - "Cargo.lock"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.repository }}-${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  package:
    name: package (${{ matrix.vscode_target }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - vscode_target: win32-x64
            rust_target: x86_64-pc-windows-msvc
          - vscode_target: win32-arm64
            rust_target: aarch64-pc-windows-msvc

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust toolchain (${{ matrix.rust_target }})
        uses: dtolnay/rust-toolchain@stable
        with:
          # Pin to the exact version selected by `rust-toolchain.toml`.
          # Using `stable` here resolves to whatever rustc is currently
          # newest, which then gets overridden by the workspace's pinned
          # toolchain — leaving the matrix target installed under the
          # wrong toolchain and breaking cross-compile with E0463.
          toolchain: "1.95.0"
          targets: ${{ matrix.rust_target }}

      # Belt-and-suspenders: when `rust-toolchain.toml` selects the active
      # toolchain inside the workspace, the target added by the action
      # above may not be visible to the rust-toolchain.toml-selected
      # install. Re-add explicitly under the workspace toolchain.
      - name: rustup target add ${{ matrix.rust_target }}
        working-directory: ${{ github.workspace }}
        run: rustup target add ${{ matrix.rust_target }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.rust_target }}

      - name: cargo build --release msbuild-diagnostic-mcp
        run: cargo build --release -p msbuild-diagnostic-mcp --target ${{ matrix.rust_target }} --locked

      - name: cargo test msbuild-diagnostic-mcp (host arch only)
        if: matrix.rust_target == 'x86_64-pc-windows-msvc'
        run: cargo test -p msbuild-diagnostic-mcp --target ${{ matrix.rust_target }} --locked

      - name: Read workspace version
        id: workspace-version
        uses: ./.github/actions/workspace-version

      - name: Verify package.json version matches workspace version
        shell: pwsh
        run: |
          $pkg = Get-Content -Raw crates/msbuild-diagnostic-mcp/extension/package.json | ConvertFrom-Json
          $pkgVer = $pkg.version
          $wsVer = "${{ steps.workspace-version.outputs.version }}"
          if ($pkgVer -ne $wsVer) {
              Write-Error "package.json version '$pkgVer' does not match workspace version '$wsVer'."
              exit 1
          }
          Write-Host "package.json version OK: $pkgVer"

      - name: Stage binary into extension/bin/
        shell: pwsh
        run: |
          $src = "target/${{ matrix.rust_target }}/release/msbuild-diagnostic-mcp.exe"
          $dst = "crates/msbuild-diagnostic-mcp/extension/bin/msbuild-diagnostic-mcp.exe"
          New-Item -ItemType Directory -Force -Path (Split-Path $dst) | Out-Null
          Copy-Item $src $dst -Force
          $ver = "${{ steps.workspace-version.outputs.version }}"
          Set-Content -NoNewline -Encoding ascii `
              -Path crates/msbuild-diagnostic-mcp/extension/bin/VERSION -Value $ver
          "Staged msbuild-diagnostic-mcp $ver for ${{ matrix.vscode_target }}"
          Get-ChildItem crates/msbuild-diagnostic-mcp/extension/bin

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: npm ci (extension)
        working-directory: crates/msbuild-diagnostic-mcp/extension
        run: npm ci --no-audit --no-fund

      - name: Compile TypeScript
        working-directory: crates/msbuild-diagnostic-mcp/extension
        run: npm run compile

      - name: vsce package --target ${{ matrix.vscode_target }}
        working-directory: crates/msbuild-diagnostic-mcp/extension
        run: npx vsce package --target ${{ matrix.vscode_target }} --no-dependencies

      - name: Verify VSIX was produced
        shell: pwsh
        working-directory: crates/msbuild-diagnostic-mcp/extension
        run: |
          $vsix = Get-ChildItem -Filter "*.vsix" | Select-Object -First 1
          if (-not $vsix) { throw "No .vsix produced" }
          "Built: $($vsix.Name) ($([math]::Round($vsix.Length / 1KB, 1)) KB)"

      - name: Upload VSIX artifact
        uses: actions/upload-artifact@v5
        with:
          name: msbuild-diagnostic-mcp-${{ matrix.vscode_target }}
          path: crates/msbuild-diagnostic-mcp/extension/*.vsix
          if-no-files-found: error
          retention-days: 30
